name: Verify
on:
  push:
  pull_request:

# Production-supported CPython releases as of 2026-10-23.
# Python 3.9 and 3.10 are EOL; legacy syntax support stays best-effort only.
permissions:
  contents: read

# Superseded runs on the same ref are cancelled; main and PR heads still gate releases.
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.11', '3.12', '3.13', '3.14', '3.15']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      # Pinned to immutable commits; dependabot keeps them current.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Python and platform
        run: python --version
      - name: Unit and integration regression suite
        run: python -m unittest discover -s tests
      - name: Founder profile validation
        run: python scripts/learnprint.py validate --profile profiles/founder-default.json
      - name: Starter template validation
        run: python scripts/learnprint.py validate --profile templates/learner-profile-starter.json --topic templates/topic-state.json
      - name: Distribution contract
        run: python scripts/check_package.py
      - name: Staged Git-index privacy guard
        run: python scripts/learnprint_publish_guard.py --repo .
